services:

  traefik:
    image: traefik:v3.7.1
    container_name: traefik
    command:
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      # HTTP
      - --entrypoints.web.address=:80
      # HTTPS
      - --entrypoints.websecure.address=:443
      # Redirect HTTP -> HTTPS
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      # Let's Encrypt
      - --certificatesresolvers.letsencrypt.acme.email=admin@example.com
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Traefik can use docker to detect containers
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Certificates configurations
      - ./traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
      # Access to my certificates
      - ./certs:/certs:ro
      # Save the certificates renew
      - ./letsencrypt/:/letsencrypt/
    networks:
      - frontend
    restart: unless-stopped

  springboot:
    build:
      context: api/
      dockerfile: docker/fshop-api.dockerfile
    container_name: springboot
    networks:
      - frontend
    restart: unless-stopped
    labels:
      # Detect the container with traefik
      - traefik.enable=true
      - traefik.http.routers.springboot.entrypoints=websecure
      # Enable HTTPS
      - traefik.http.routers.springboot.tls=true
      - traefik.http.routers.springboot.tls.certresolver=letsencrypt
      # Match /api requests (replace localhost by your domain name)
      - traefik.http.routers.springboot.rule=Host(`localhost`)
      - traefik.http.routers.springboot.rule=PathPrefix(`/api`)
      # Remove /api before forwarding to Spring Boot
      - traefik.http.middlewares.springboot-strip.stripprefix.prefixes=/api
      - traefik.http.routers.springboot.middlewares=springboot-strip
      # use the API port
      - traefik.http.services.springboot.loadbalancer.server.port=8888

  frontend:
    image: httpd:2.4
    container_name: httpd
    volumes:
      - ./ui:/usr/local/apache2/htdocs:ro
    labels:
      - traefik.enable=true
      # Everything except /api
      - traefik.http.routers.frontend.rule=PathPrefix(`/`)
      - traefik.http.routers.frontend.entrypoints=websecure
      # Enable HTTPS
      - traefik.http.routers.frontend.tls=true
      - traefik.http.routers.frontend.tls.certresolver=letsencrypt
      # use HTTP port
      - traefik.http.services.frontend.loadbalancer.server.port=80
    networks:
      - frontend
    restart: unless-stopped

networks:
  frontend:
    driver: bridge
